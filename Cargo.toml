[package]
name = "remi-cat"
version = "0.2.38"
description = "A multi-agent AI assistant with IM platform support, TUI, and web interface"
edition = "2021"
license = "MIT"
repository = "https://github.com/another-s347/remi-cat"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ name }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"
bin-dir = "{ name }/{ bin }{ binary-ext }"

[workspace]
members = [
    ".",
    "crates/im-feishu",
    "crates/user-store",
    "crates/bot-runtime-core",
    "crates/bot-core",
]
default-members = ["."]
resolver = "2"

[features]
default = ["secure-storage"]
secure-storage = ["dep:keyring"]
experimental-pty = ["bot-core/experimental-pty"]

[dependencies]
a2a = { package = "a2a-lf", version = "0.3.0" }
a2a-server = { package = "a2a-server-lf", version = "0.4.1", default-features = false }
async-trait = "0.1"
bot-core = { path = "crates/bot-core" }
im-feishu = { path = "crates/im-feishu" }
user-store = { path = "crates/user-store" }
agent-client-protocol = { version = "1.0.1", features = ["unstable_elicitation"] }
remi-agentloop = { git = "https://github.com/another-s347/remi-agentloop.git", rev = "eb2f30f5ff07845ee9e44427f32e8b8cec582ffa", features = [
    "http-client",
    "tracing-sentry",
] }

anyhow = "1"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
dotenvy = "0.15"
figment = { version = "0.10", features = ["yaml"] }
flate2 = "1"
futures = "0.3"
git2 = "0.21"
hex = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
notify = "8.2"
pulldown-cmark = "0.13"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
semver = "1"
sha2 = "0.10"
sentry = { version = "0.47", default-features = false, features = [
    "backtrace",
    "contexts",
    "debug-images",
    "panic",
    "release-health",
    "reqwest",
    "rustls",
    "tracing",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
textwrap = "0.16"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
weaver-core = { git = "https://github.com/another-s347/weaver.git", rev = "7075b7b45f2e344316d0dee0f11c7123cc1d5ecb" }
weaver-crypto = { git = "https://github.com/another-s347/weaver.git", rev = "7075b7b45f2e344316d0dee0f11c7123cc1d5ecb" }
weaver-net = { git = "https://github.com/another-s347/weaver.git", rev = "7075b7b45f2e344316d0dee0f11c7123cc1d5ecb" }
weaver-store = { git = "https://github.com/another-s347/weaver.git", rev = "7075b7b45f2e344316d0dee0f11c7123cc1d5ecb" }
zip = { version = "4", default-features = false, features = ["deflate"] }
zeroize = "1"
tower = "0.5"
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"], optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
